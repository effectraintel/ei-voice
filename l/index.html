<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>A song, sealed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314110f'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23b08d2f' stroke-width='2.5'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23b08d2f' text-anchor='middle'%3EEI%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --gold:#b08d2f; --gold-soft:rgba(176,141,47,.42); --gold-faint:rgba(176,141,47,.16);
    --char:#14110f; --surface:#1a1613; --surface-2:#1f1a16; --border:#322b22;
    --ink:#efe9df; --dim:#9a9184; --dimmer:#6f675c;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--char);color:var(--ink)}
  body{
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
    padding:26px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .top{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:34px; }
  .mark{
    font-family:var(--serif); font-size:15px; letter-spacing:.16em; color:var(--gold);
    border:1px solid var(--gold-soft); border-radius:5px; padding:3px 7px 4px; line-height:1;
  }
  .wordmark{
    font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold); white-space:nowrap;
  }
  main{ flex:1; width:100%; max-width:430px; margin:0 auto; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:18px 18px 22px; box-shadow:0 24px 60px -34px rgba(0,0,0,.9);
  }
  .art{
    width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--surface-2);
    border:1px solid rgba(255,255,255,.045); display:flex; align-items:center; justify-content:center;
  }
  .art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .art .none{ font-family:var(--serif); font-size:13px; letter-spacing:.28em; color:var(--gold-faint); text-transform:uppercase; }
  .for{
    margin:20px 0 0; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold);
  }
  h1{
    font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.16;
    letter-spacing:-.01em; margin:8px 0 0; color:var(--ink);
  }
  .note{
    font-family:var(--serif); font-style:italic; font-size:16px; line-height:1.55; color:#cdc4b6;
    margin:12px 0 0; white-space:pre-wrap;
  }
  .from{ margin:12px 0 0; font-size:13px; color:var(--dim); }
  .from b{ font-weight:500; color:#c9c0b2; }
  audio{ width:100%; margin:20px 0 0; height:38px; filter:saturate(0) contrast(.94) brightness(1.06); }

  /* BUILD 271. THE PLAYER IS OURS, NOT THE BROWSER'S.
     17 Nov 2026, after he opened his own song: "it didn't even open in the player look and feel we created just a
     link with a play button." That is exactly what it was - a native <audio controls>, the browser's grey bar with
     a triangle on it - and the words were folded away behind a closed "The words" row, so they were never read.
     So the song now plays in an EI player (one gold action: play or pause, a hairline that fills, the clock) and
     the words sit open underneath it, on the same page as the picture they belong to. */
  .player{
    display:flex; align-items:center; gap:14px; margin:22px 0 0;
    padding:14px 16px; border:1px solid var(--border); border-radius:12px;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
  }
  .pp{
    flex:0 0 auto; width:46px; height:46px; border-radius:50%;
    border:1px solid var(--gold-soft); background:transparent; color:var(--gold);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    -webkit-tap-highlight-color:transparent; transition:background .18s ease, border-color .18s ease;
  }
  .pp:hover{ background:var(--gold-faint); border-color:var(--gold) }
  .pp:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px }
  .pp svg{ width:16px; height:16px; display:block; fill:currentColor }
  .pp.playing{ background:var(--gold); border-color:var(--gold); color:var(--char) }
  .track{ flex:1 1 auto; min-width:0 }
  .bar{
    position:relative; height:18px; display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .bar::before{ content:''; position:absolute; left:0; right:0; height:1px; background:var(--border) }
  .fill{ position:absolute; left:0; height:1px; width:0; background:var(--gold) }
  .dot{
    position:absolute; left:0; width:7px; height:7px; border-radius:50%; background:var(--gold);
    transform:translateX(-3.5px); opacity:0; transition:opacity .18s ease;
  }
  .bar:hover .dot, .player.touched .dot{ opacity:1 }
  .times{
    display:flex; justify-content:space-between; margin-top:2px;
    font-size:11px; letter-spacing:.12em; color:var(--dimmer); font-variant-numeric:tabular-nums;
  }
  .words{ margin:26px 0 0; }
  .words h2{
    font-family:var(--serif); font-weight:400; font-size:15px; letter-spacing:.02em;
    margin:0 0 14px; color:#c9c0b2;
  }
  .words .tag{
    margin:18px 0 8px; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-soft);
  }
  .words .tag:first-of-type{ margin-top:0 }
  .words .line{ margin:0; font-size:15px; line-height:1.85; color:#cdc4b9 }
  .words .gap{ height:10px }
  .hair{ height:1px; background:var(--border); margin:20px 0 0; border:0; }
  .stamp{ margin:14px 0 0; font-size:12px; color:var(--dim); letter-spacing:.01em; }
  .stamp b{ color:#c9c0b2; font-weight:500 }
  details{ margin:14px 0 0; }
  summary{
    list-style:none; cursor:pointer; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold); display:flex; align-items:center; gap:8px; user-select:none;
  }
  summary::-webkit-details-marker{ display:none }
  summary .p{ font-size:14px; letter-spacing:0; line-height:1; color:var(--gold-soft) }
  .proof{ margin:14px 0 0; display:grid; grid-template-columns:74px 1fr; gap:9px 12px; font-size:11.5px; }
  .proof dt{ color:var(--dimmer); letter-spacing:.06em; }
  .proof dd{ margin:0; color:#c4bbae; word-break:break-all; font-variant-numeric:tabular-nums; line-height:1.45 }
  .proves{ margin:14px 0 0; font-size:11.5px; line-height:1.6; color:var(--dimmer); }
  .keep{
    margin:22px 0 0; padding:18px 18px 20px; border:1px solid var(--gold-faint); border-radius:16px;
    background:linear-gradient(180deg, rgba(176,141,47,.055), rgba(176,141,47,.015));
  }
  .keep h2{ font-family:var(--serif); font-weight:400; font-size:19px; margin:0; color:var(--ink); }
  .keep p{ margin:7px 0 0; font-size:12.5px; line-height:1.6; color:var(--dim); }
  .keep a{
    display:inline-block; margin:14px 0 0; padding:11px 18px; border-radius:9px;
    background:var(--gold); color:#15110c; font-size:12.5px; font-weight:600; letter-spacing:.04em;
    text-decoration:none;
  }
  .quiet{ margin:20px 0 0; font-size:12.5px; line-height:1.65; color:var(--dim); }
  .quiet b{ color:#c9c0b2; font-weight:500 }
  .held{ text-align:center; padding:6px 4px 2px }
  .held .lbl{ font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold) }
  .held p{ font-size:13.5px; line-height:1.7; color:var(--dim); margin:12px 0 0 }
  .held p b{ color:#cec5b7; font-weight:500 }
  footer{
    margin:30px auto 0; width:100%; max-width:430px; text-align:center;
    font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; line-height:2.1; color:var(--dimmer);
  }
  footer .l2{ letter-spacing:.06em; text-transform:none; font-size:10.5px; color:#5d564d }
  .load{ font-family:var(--serif); font-size:15px; color:var(--dim); text-align:center; padding:52px 0 }
  .hide{ display:none !important }
</style>
</head>
<body>
  <div class="top">
    <span class="mark">L0B</span>
    <span class="wordmark">Effectra&nbsp;Intelligence</span>
  </div>

  <main>
    <div id="load" class="load">Opening it…</div>
    <div id="gift" class="hide"></div>
  </main>

  <footer id="foot" class="hide">
    <div>Powered by Effectra Intelligence</div>
    <div class="l2">Proof on chain. Payload in the vault.</div>
    <div class="l2">© 2026 Effectra Intelligence</div>
  </footer>

<script>
(function () {
  // The engine app. One constant: the address can move without this page caring.
  var ENGINE = 'https://solene-7ba0f3a1.base44.app';
  var DOOR = 'https://door.effectra.ai';

  var gift = document.getElementById('gift');
  var load = document.getElementById('load');
  var foot = document.getElementById('foot');

  function code() {
    var q = new URLSearchParams(location.search);
    var c = (q.get('c') || q.get('code') || '').trim();
    if (c) return c;
    var m = location.pathname.match(/\/l\/([A-Za-z0-9]{4,20})\/?$/);
    return m ? m[1] : '';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function when(iso, withTime) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var day = d.getUTCDate(), mon = ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getUTCMonth()];
    var s = day + ' ' + mon + ' ' + d.getUTCFullYear();
    if (withTime) {
      s += ', ' + String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0') + ' UTC';
    }
    return s;
  }

  function short(sha) { return sha ? sha.slice(0, 16) + '…' : ''; }

  // Edwin, 15 Nov 2026: "When you access the door and you don't have an understanding why and what you will
  // just be a stranger wandering into a house with no purpose." So the door is not handed a bare front page:
  // the gift code rides along, and the door says on its gate what this person came for before it asks for a
  // fingerprint. Nothing to install, nothing to explain.
  function giftAddr(d) {
    return d && d.code ? '/?gift=' + encodeURIComponent(d.code) : '/';
  }

  function fail(why) {
    load.className = 'load';
    load.textContent = why || 'This one does not open anything.';
    foot.className = '';
  }

  function clock(sec) {
    var t = Math.max(0, Math.round(Number(sec) || 0));
    var m = Math.floor(t / 60), r = t % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  // A lyric line that is only a tag is a label, not a line to sing.
  function wordsBlock(words) {
    var out = '<section class="words"><h2>The words</h2>';
    String(words).split(/\r?\n/).forEach(function (raw) {
      var line = String(raw).trim();
      if (!line) { out += '<div class="gap"></div>'; return; }
      var tag = line.match(/^\[([^\]]+)\]$/);
      if (tag) { out += '<p class="tag">' + esc(tag[1]) + '</p>'; return; }
      out += '<p class="line">' + esc(line.replace(/^\[([^\]]+)\]\s*/, '')) + '</p>';
    });
    return out + '</section>';
  }

  function draw(d) {
    load.className = 'hide';
    gift.className = '';
    foot.className = '';

    var held = d.state === 'held';
    var claimed = d.state === 'claimed';
    var forLine = d.for_name ? ('For ' + esc(d.for_name)) : 'A song, sealed';
    var fromLine = 'sealed and given by <b>' + esc(d.sender || 'Edwin') + '</b>';

    var html = '<div class="card">';
    html += '<div class="art">' + (d.cover
      ? '<img src="' + esc(d.cover) + '" alt="" referrerpolicy="no-referrer" />'
      : '<span class="none">sealed</span>') + '</div>';
    html += '<p class="for">' + forLine + '</p>';
    html += '<h1>' + esc(d.title || 'a song') + '</h1>';
    if (d.gift_note) html += '<p class="note">' + esc(d.gift_note) + '</p>';

    if (held) {
      html += '<hr class="hair" />';
      html += '<div class="held"><span class="lbl">Kept for you</span>'
        + '<p>The thirty days for this gift have been and gone, so it is resting rather than playing. '
        + 'It is <b>not lost</b>: it is held whole, with its picture and its proof, waiting for you.</p></div>';
    } else {
      html += '<div class="player" id="pl">'
        + '<button class="pp" id="pp" type="button" aria-label="Play">'
        + '<svg viewBox="0 0 24 24" id="ppicon"><path d="M8 5v14l11-7z"/></svg></button>'
        + '<div class="track">'
        + '<div class="bar" id="bar"><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>'
        + '<div class="times"><span id="el">0:00</span><span id="du">' + (d.duration ? clock(d.duration) : '0:00') + '</span></div>'
        + '</div></div>'
        + '<audio id="player" preload="metadata" src="' + esc(d.stream) + '"></audio>';
      html += '<p class="from">' + fromLine + '</p>';
      html += '<hr class="hair" />';
      html += '<p class="stamp">Sealed <b>' + when(d.sealed_at) + '</b>';
      if (claimed) html += ' &middot; yours to keep';
      html += '</p>';
    }

    html += '<details><summary><span class="p">+</span> Proof</summary><dl class="proof">';
    if (d.code) html += '<dt>ref</dt><dd>' + esc(d.code) + '</dd>';
    if (d.sha) html += '<dt>sha256</dt><dd>' + esc(d.sha) + '</dd>';
    if (d.sealed_at) html += '<dt>sealed</dt><dd>' + when(d.sealed_at, true) + '</dd>';
    if (d.opened_at) html += '<dt>opened</dt><dd>' + when(d.opened_at, true) + '</dd>';
    if (d.window_ends_at && !held) html += '<dt>open to</dt><dd>' + when(d.window_ends_at) + '</dd>';
    if (d.window_ends_at && held) html += '<dt>window</dt><dd>closed ' + when(d.window_ends_at) + '</dd>';
    html += '</dl><p class="proves">That sha256 is of the recording itself, measured when it was sealed. '
      + 'If a single byte of the file changes, the hash stops matching. Anyone can send you an mp3. '
      + 'This one carries the measurement.</p></details>';
    html += '</div>';

    // The ask, once, and never before the song. Full play is the gift; keeping it is the only thing on offer.
    if (held) {
      html += '<div class="keep"><h2>Want it back?</h2>'
        + '<p>A gift is kept whole until it is claimed. Open an account at the door and everything sent to you '
        + 'comes with it, proof and picture included.</p>'
        + '<a href="' + DOOR + giftAddr(d) + '">Open the door</a></div>';
    } else {
      html += '<div class="keep"><h2>This is yours to keep.</h2>'
        + '<p>It plays in full here for ' + (claimed ? 'good' : (d.days_left === 1 ? 'the rest of today' : (d.days_left + ' more days')))
        + '. Keeping it means a handle at the door: the song then lives in your own vault, with this proof, '
        + 'and it is yours for good.</p>'
        + '<a href="' + DOOR + giftAddr(d) + '">Keep it</a></div>';
    }

    /* The words are the song, not a footnote: they sit open under the player, with [Verse] / [Chorus] as small
       gold labels instead of raw brackets. Nothing is folded away that he came to read. */
    if (d.words) html += wordsBlock(d.words);

    gift.innerHTML = html;

    wirePlayer();
  }

  /* One gold action at a time: the button plays or it pauses, and the hairline shows where the song is. Scrubbing
     works with a finger and with a mouse, because a man listening on a phone drags it. */
  function wirePlayer() {
    var audio = document.getElementById('player');
    var btn = document.getElementById('pp');
    var icon = document.getElementById('ppicon');
    var bar = document.getElementById('bar');
    var fill = document.getElementById('fill');
    var dot = document.getElementById('dot');
    var el = document.getElementById('el');
    var du = document.getElementById('du');
    var pl = document.getElementById('pl');
    if (!audio || !btn || !bar) return;

    var PLAY = '<path d="M8 5v14l11-7z"/>';
    var PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

    function paint() {
      var dur = isFinite(audio.duration) ? audio.duration : 0;
      var pct = dur ? Math.min(1, audio.currentTime / dur) : 0;
      fill.style.width = (pct * 100) + '%';
      dot.style.left = (pct * 100) + '%';
      el.textContent = clock(audio.currentTime);
      du.textContent = dur ? clock(dur) : du.textContent;
    }
    function setPlaying(on) {
      btn.classList.toggle('playing', on);
      icon.innerHTML = on ? PAUSE : PLAY;
      btn.setAttribute('aria-label', on ? 'Pause' : 'Play');
    }

    btn.addEventListener('click', function () {
      if (audio.paused) { audio.play().catch(function () { /* a browser that refuses says so silently */ }); }
      else { audio.pause(); }
    });
    audio.addEventListener('play', function () { setPlaying(true); });
    audio.addEventListener('pause', function () { setPlaying(false); });
    audio.addEventListener('timeupdate', paint);
    audio.addEventListener('loadedmetadata', paint);
    audio.addEventListener('ended', function () {
      setPlaying(false); paint();
      var keep = gift.querySelector('.keep');
      if (keep) keep.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    function seek(ev) {
      var dur = isFinite(audio.duration) ? audio.duration : 0;
      if (!dur) return;
      var r = bar.getBoundingClientRect();
      var x = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX) - r.left;
      audio.currentTime = Math.max(0, Math.min(dur, (x / r.width) * dur));
      paint();
    }
    bar.addEventListener('pointerdown', function (ev) {
      pl.classList.add('touched');
      bar.setPointerCapture && bar.setPointerCapture(ev.pointerId);
      seek(ev);
      var move = function (e) { seek(e); };
      var up = function () {
        bar.removeEventListener('pointermove', move);
        bar.removeEventListener('pointerup', up);
      };
      bar.addEventListener('pointermove', move);
      bar.addEventListener('pointerup', up);
    });
    paint();
  }

  var c = code();
  if (!c) { fail('There is no gift in this address.'); return; }

  fetch(ENGINE + '/functions/songListenCard?c=' + encodeURIComponent(c), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || (d.state === 'closed')) { fail(d && (d.why || d.reason) ? d.why || d.reason : ''); return; }
      if (!d.title) { fail('This one does not open anything.'); return; }
      draw(d);
    })
    .catch(function () { fail('The door did not answer. Try again in a moment.'); });
})();
</script>
</body>
</html>
