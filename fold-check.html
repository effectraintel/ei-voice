<!doctype html><html><head><meta charset="utf-8"><title>fold check</title>
<style>body{margin:0;background:#2a2622;display:flex;gap:18px;padding:18px;font:12px monospace;color:#ddd}
figure{margin:0}figcaption{margin-bottom:6px}iframe{border:1px solid #555;display:block}#report{margin:0}</style></head><body>
<figure><figcaption>320 full</figcaption><iframe id="full" src="fold-full.html?v=1" width="320" height="568"></iframe></figure>
<figure><figcaption>320 folded</figcaption><iframe id="tight" src="fold-tight.html?v=1" width="320" height="568"></iframe></figure>
<pre id="report">measuring…</pre>
<script>
function m(id){const f=document.getElementById(id),d=f.contentDocument,w=f.contentWindow;
 const r=el=>{const b=el.getBoundingClientRect();return Math.round(b.height)};
 const main=d.querySelector('main'),shelf=d.getElementById('shelf'),foot=d.querySelector('footer'),head=d.querySelector('header');
 return {frame:id,header:r(head),main:r(main),shelf:r(shelf),footer:r(foot),
  roomy:main.clientHeight, scrolls:main.scrollHeight>main.clientHeight,
  folded:w.getComputedStyle(d.getElementById('voicechip').parentElement).display==='none',
  bodyH:w.innerHeight};}
window.addEventListener('load',()=>setTimeout(()=>{document.getElementById('report').textContent=JSON.stringify([m('full'),m('tight')],null,1)},500));
</script></body></html>
