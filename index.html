<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Effectra Intelligence — voice and text</title>
<style>
  :root { --gold:#b08d2f; --char:#14110f; --ink:#efe9df; --dim:#9a9184; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--char); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 12px); }
  header { padding:16px 0 6px; text-align:center; }
  .wordmark { letter-spacing:.34em; font-size:11px; color:var(--gold); text-transform:uppercase; }
  .state { margin-top:6px; font-size:13px; color:var(--ink); letter-spacing:.04em; min-height:18px; }
  .warn { display:none; margin:8px 0 0; padding:10px 12px; border:1px solid #5a3a1c; background:#241a10;
    color:#e8cfae; font-size:12.5px; line-height:1.5; border-radius:10px; text-align:left; }
  .warn b { color:#f0dcbd; }
  main { flex:1; overflow-y:auto; padding:10px 2px 4px; -webkit-overflow-scrolling:touch; }
  .turn { margin:0 0 14px; max-width:92%; }
  .turn.you { margin-left:auto; text-align:right; }
  .who { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .said { white-space:pre-wrap; }
  .turn.you .said { color:#cfc6b6; }
  .acts { margin-top:6px; font-size:12px; color:var(--gold); }
  footer { text-align:center; padding-top:8px; }
  button#mic { width:92px; height:92px; border-radius:50%; border:1px solid #3a332a; background:#1d1916;
    color:var(--ink); display:grid; place-items:center; margin:0 auto 8px; transition:transform .12s, background .2s, border-color .2s; }
  button#mic:active { transform:scale(.96); }
  button#mic.live { background:#2a1614; border-color:var(--gold); box-shadow:0 0 0 8px rgba(176,141,47,.10); }
  button#mic.work { opacity:.5; }
  svg { width:36px; height:36px; }
  .hint { font-size:11.5px; color:var(--dim); letter-spacing:.03em; min-height:15px; margin-bottom:8px; }
  .typebar { display:flex; gap:8px; margin:0 0 6px; }
  .typebar input { flex:1; min-width:0; background:#1d1916; border:1px solid #3a332a; color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:15px; }
  .typebar button { background:#2a2118; border:1px solid #4a3d24; color:var(--gold); border-radius:10px; padding:0 14px; font-size:14px; }
  .brand { margin-top:6px; font-size:9px; letter-spacing:.22em; color:#5d564c; text-transform:uppercase; line-height:1.7; }
</style>
</head>
<body>
<header>
  <div class="wordmark">Effectra Intelligence</div>
  <div class="state" id="state">Voice and text — tap the mic, or use the line below</div>
  <div class="warn" id="warn"></div>
</header>
<main id="log"></main>
<footer>
  <button id="mic" aria-label="Record">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 3.5a3 3 0 0 1 3 3v5.5a3 3 0 0 1-6 0V6.5a3 3 0 0 1 3-3z"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
      <path d="M12 18v3"/>
    </svg>
  </button>
  <div class="hint" id="hint">tap once to start, tap again to send</div>
  <form class="typebar" id="textform" method="POST" action="https://solene-7ba0f3a1.base44.app/functions/eiVoiceText">
    <input id="typed" name="text" placeholder="or type a turn" autocomplete="off">
    <button id="sendTyped" type="submit">send</button>
  </form>
  <div class="brand">Powered by Effectra Intelligence<br>Proof on chain. Payload in the vault.<br>&copy; 2026 Effectra Intelligence</div>
</footer>
<script>
var ENDPOINT = 'https://solene-7ba0f3a1.base44.app/functions/eiVoiceTurn';
var stateEl = document.getElementById('state');
var hintEl = document.getElementById('hint');
var warnEl = document.getElementById('warn');
var logEl = document.getElementById('log');
var mic = document.getElementById('mic');
var typed = document.getElementById('typed');
var sendTyped = document.getElementById('sendTyped');

var recorder = null, chunks = [], live = false, busy = false;
var turns = [];
var sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());

function warn(msg) { warnEl.style.display = 'block'; warnEl.innerHTML = msg; }

// A preview frame cannot open the microphone at all, so say it plainly up front.
try {
  if (window.self !== window.top) {
    warn('<b>This is showing inside a preview frame.</b> Open the link directly in Safari or Chrome on your phone, otherwise the browser will refuse the microphone without asking.');
  }
} catch (e) { /* cross-origin parent: same conclusion */ 
  warn('<b>This is showing inside a frame.</b> Open the link directly in your browser, otherwise the microphone is refused.');
}

if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
  warn('<b>This browser has no microphone access.</b> ' + (location.protocol === 'https:' ? 'Try Safari or Chrome directly.' : 'The page must be served over HTTPS.'));
}
if (typeof window.MediaRecorder === 'undefined') {
  warn('<b>This browser cannot record audio.</b> Use the typed line below, or open in Safari on iOS 14.3 or newer.');
}

function esc(t) { return String(t == null ? '' : t); }

function say(role, text, acts) {
  var wrap = document.createElement('div');
  wrap.className = 'turn ' + (role === 'engine' ? 'engine' : 'you');
  var who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'engine' ? 'Effectra' : 'You';
  var said = document.createElement('div');
  said.className = 'said';
  said.textContent = esc(text);
  wrap.appendChild(who); wrap.appendChild(said);
  if (acts && acts.length) {
    var a = document.createElement('div');
    a.className = 'acts';
    a.textContent = acts.map(function (x) {
      return x.tool === 'create_reminder' ? 'reminder set' : x.tool === 'capture' ? 'captured' : x.tool;
    }).join(' · ');
    wrap.appendChild(a);
  }
  logEl.appendChild(wrap);
  logEl.scrollTop = logEl.scrollHeight;
}

// The voice picker matters more than it looks. On 4 Nov the page answered in
// Finnish on Edwin's laptop: with no English voice chosen, the browser falls
// back to the SYSTEM voice, whatever the machine's language is. So the language
// is now explicit, and it follows HIM: the turn returns the language he spoke,
// and the page picks a voice in that language.
function voiceFor(lang) {
  var voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  var want = /^af/i.test(lang || '') ? 'af' : 'en';
  var pool = voices.filter(function (v) { return new RegExp('^' + want, 'i').test(v.lang || ''); });
  var saved = '';
  try { saved = localStorage.getItem('ei_voice_name_' + want) || ''; } catch (e) {}
  if (saved) {
    var hit = pool.filter(function (v) { return v.name === saved; })[0];
    if (hit) return hit;
  }
  if (want === 'af') {
    return pool.filter(function (v) { return /af-ZA/i.test(v.lang); })[0] || pool[0] || null;
  }
  return pool.filter(function (v) { return /en-ZA/i.test(v.lang); })[0]
    || pool.filter(function (v) { return /en-GB/i.test(v.lang); })[0]
    || pool.filter(function (v) { return /en-US/i.test(v.lang); })[0]
    || pool[0] || null;
}

// ---- Speaking ------------------------------------------------------------
// Until 4 Nov the page spoke with whatever voice the device happened to have,
// which is why it sounded like a phone reading a menu. It now speaks in the
// Effectra voice (the same one the audition page demonstrates) and starts on
// the FIRST SENTENCE instead of waiting for the whole answer: each sentence is
// rendered in parallel, then played in order. Measured 2.7 to 3.5 seconds per
// sentence against roughly thirteen for a full answer that way.
//
// If the voice service is unreachable the device voice takes over, so the
// channel never goes silent. The voice name is provisional until Edwin picks.
var SPEAK_ENDPOINT = 'https://solene-7ba0f3a1.base44.app/functions/eiVoiceSpeak';
var SPEAK_VOICE = 'Kore';
var playback = { token: 0, audios: [] };

function stopPlayback() {
  playback.token++;
  playback.audios.forEach(function (a) { try { a.pause(); } catch (e) {} });
  playback.audios = [];
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}

function splitSentences(text) {
  var parts = String(text || '').replace(/\s+/g, ' ').trim().match(/[^.!?\u2026]+[.!?\u2026]*/g) || [];
  var out = [];
  parts.forEach(function (p) {
    p = p.trim();
    if (!p) return;
    while (p.length > 220) { out.push(p.slice(0, 220)); p = p.slice(220).trim(); }
    if (p) out.push(p);
  });
  // Four segments is enough for a spoken turn; anything longer is merged into
  // the last one so the mouth never runs far behind the answer.
  if (out.length > 4) out = out.slice(0, 3).concat([out.slice(3).join(' ')]);
  return out;
}

function renderSegment(text, lang) {
  return fetch(SPEAK_ENDPOINT, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: text, lang: lang, voice: SPEAK_VOICE })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.ok || !d.audio_base64) throw new Error((d && d.error) || 'no audio');
    return 'data:audio/wav;base64,' + d.audio_base64;
  });
}

function deviceSpeak(text, lang) {
  if (!('speechSynthesis' in window) || !text) return;
  var u = new SpeechSynthesisUtterance(text);
  var v = voiceFor(lang);
  u.lang = /^af/i.test(lang || '') ? 'af-ZA' : 'en-ZA';
  if (v) { u.voice = v; u.lang = v.lang || u.lang; }
  u.rate = 1.02;
  u.onstart = function () { stateEl.textContent = 'speaking'; };
  u.onend = function () { stateEl.textContent = 'tap the mic'; };
  speechSynthesis.speak(u);
}

function speak(text, lang) {
  if (!text) return;
  stopPlayback();
  var token = playback.token;
  var langCode = /^af/i.test(lang || '') ? 'af' : 'en';
  var segments = splitSentences(text);

  // Fire every sentence at once. the first one plays the moment it lands.
  var ready = segments.map(function (seg) { return renderSegment(seg, langCode); });

  var i = 0;
  function next() {
    if (token !== playback.token) return;
    if (i >= ready.length) { stateEl.textContent = 'tap the mic'; return; }
    var idx = i++;
    stateEl.textContent = 'speaking';
    ready[idx].then(function (src) {
      if (token !== playback.token) return;
      var audio = new Audio(src);
      playback.audios.push(audio);
      audio.onended = next;
      audio.onerror = next;
      audio.play().catch(function () {
        // Autoplay blocked or unsupported: fall back to the device voice for
        // this sentence rather than dropping it.
        deviceSpeak(segments[idx], langCode);
      });
    }).catch(function () {
      deviceSpeak(segments[idx], langCode);
      next();
    });
  }
  next();
}

// Voice lists load asynchronously in most browsers; touching them at boot and
// again on the change event means the first answer is not spoken in the wrong
// language while the list is still empty.
if ('speechSynthesis' in window) {
  try { speechSynthesis.getVoices(); } catch (e) {}
  window.speechSynthesis.onvoiceschanged = function () { try { speechSynthesis.getVoices(); } catch (e) {} };
}

// ---- Waiting out loud ----------------------------------------------------
// Edwin's rule, 4 Nov 2026: "Waiting for something a few seconds is not a
// problem, waiting without feedback and eventually getting stuck is." So a turn
// now carries three things it did not have: a tone the instant the mic closes
// (you hear that it landed), a running clock whose stage changes as it waits,
// and a hard stop at 25 seconds that speaks, instead of a spinner that never
// returns.
function tone(freq, ms, gain) {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    window.__eiAC = window.__eiAC || new AC();
    var ac = window.__eiAC;
    if (ac.state === 'suspended') ac.resume();
    var o = ac.createOscillator(), g = ac.createGain();
    var peak = gain || 0.05;
    o.type = 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(ac.destination);
    var now = ac.currentTime;
    g.gain.setValueAtTime(peak, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + (ms || 120) / 1000);
    o.start(now);
    o.stop(now + (ms || 120) / 1000 + 0.02);
  } catch (e) {}
}

function stageFor(ms) {
  if (ms < 1200) return 'got it';
  if (ms < 4000) return 'thinking';
  if (ms < 9000) return 'looking that up';
  if (ms < 16000) return 'still working, this one is slow';
  return 'nearly out of time';
}

var waiting = null;

function endWaiting() {
  if (!waiting) return;
  clearInterval(waiting.clock);
  clearInterval(waiting.tick);
  clearTimeout(waiting.watch);
  waiting = null;
}

function setBusy(v) {
  busy = v;
  if (v) mic.classList.add('work');
  else mic.classList.remove('work');
}

async function send(payload) {
  setBusy(true);
  hintEl.textContent = 'sent — hold on';

  // Two quick notes: the first says "the mic closed", the second "I am on it".
  tone(700, 90, 0.06);
  setTimeout(function () { tone(980, 90, 0.05); }, 130);

  var t0 = Date.now();
  var ctl = new AbortController();
  var timedOut = false;

  stateEl.textContent = stageFor(0) + ' 0.0s';
  waiting = {
    clock: setInterval(function () {
      var ms = Date.now() - t0;
      stateEl.textContent = stageFor(ms) + ' ' + (ms / 1000).toFixed(1) + 's';
    }, 200),
    // A quiet tick every five seconds, so waiting is audible from across a room.
    tick: setInterval(function () { tone(1250, 45, 0.02); }, 5000),
    // Nothing may hang: at 25 seconds the turn is cut and the channel speaks.
    watch: setTimeout(function () {
      timedOut = true;
      try { ctl.abort(); } catch (e) {}
    }, 25000)
  };

  try {
    var r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ session_id: sessionId, history: turns }, payload)),
      signal: ctl.signal
    });
    var d = await r.json();
    if (!d.ok) throw new Error(d.error || 'turn failed');
    tone(880, 70, 0.05);
    if (d.you_said) { say('you', d.you_said); turns.push({ role: 'you', content: d.you_said }); }
    if (d.reply) {
      say('engine', d.reply, d.actions);
      turns.push({ role: 'engine', content: d.reply });
      speak(d.reply, d.reply_lang || 'en');
    }
    var secs = ((Date.now() - t0) / 1000).toFixed(1);
    hintEl.textContent = 'tap once to start, tap again to send · last turn ' + secs + 's';
    stateEl.textContent = 'ready';
  } catch (e) {
    if (timedOut) {
      var msg = 'That took too long, Boss. Ask me again.';
      say('engine', msg);
      turns.push({ role: 'engine', content: msg });
      speak(msg, 'en');
      hintEl.textContent = 'timed out at 25s — tap to ask again';
      stateEl.textContent = 'timed out';
    } else {
      tone(260, 220, 0.06);
      hintEl.textContent = 'that turn failed — tap to try again';
      stateEl.textContent = 'error: ' + (e.message || 'unknown');
    }
  } finally {
    endWaiting();
    setBusy(false);
  }
}

function blobToB64(blob) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { res(String(fr.result).split(',')[1] || ''); };
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

async function start() {
  if (busy) return;
  stateEl.textContent = 'asking for the mic…';
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    var type = '';
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) type = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/mp4')) type = 'audio/mp4';
    recorder = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      stream.getTracks().forEach(function (t) { t.stop(); });
      var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      if (blob.size > 1200) {
        blobToB64(blob).then(function (b64) {
          send({ audio_base64: b64, mime: blob.type || 'audio/webm' });
        }).catch(function () { stateEl.textContent = 'could not read the recording'; });
      } else {
        hintEl.textContent = 'too short — hold on a moment longer';
        stateEl.textContent = 'tap the mic';
      }
    };
    recorder.start();
    live = true;
    mic.classList.add('live');
    stateEl.textContent = 'listening';
    hintEl.textContent = 'tap again to send';
  } catch (e) {
    var n = (e && e.name) || 'Error';
    live = false;
    mic.classList.remove('live');
    stateEl.textContent = 'mic unavailable';
    var why = {
      NotAllowedError: 'You (or the browser) said no to the microphone. In Safari: tap the aA icon, Website Settings, set Microphone to Allow, then reload.',
      PermissionDeniedError: 'The microphone is blocked for this site. Allow it in the browser settings, then reload.',
      NotFoundError: 'No microphone was found.',
      NotReadableError: 'Another app is holding the microphone.',
      SecurityError: 'The browser refused for security reasons — this usually means the page is inside a frame or not on HTTPS.'
    }[n] || ('The browser said: ' + n + '.');
    hintEl.textContent = why;
  }
}

function stop() {
  if (recorder && live) {
    live = false;
    mic.classList.remove('live');
    try { recorder.stop(); } catch (e) {}
  }
}

mic.addEventListener('click', function () {
  stopPlayback();
  if (live) stop(); else start();
});

var textform = document.getElementById('textform');
textform.addEventListener('submit', function (e) {
  e.preventDefault();
  var t = typed.value.trim();
  if (!t) return;
  typed.value = '';
  send({ text: t });
});

window.addEventListener('beforeunload', stop);
</script>
</body>
</html>
