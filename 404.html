<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Effectra Intelligence</title>
<style>
  html,body{margin:0;height:100%;background:#14110f;color:#efe9df}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
  .mark{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:15px;letter-spacing:.16em;color:#b08d2f;
        border:1px solid rgba(176,141,47,.42);border-radius:5px;padding:3px 7px 4px;display:inline-block;line-height:1}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:400;font-size:22px;margin:20px 0 0}
  p{color:#9a9184;font-size:13px;line-height:1.7;margin:10px 0 0;max-width:340px}
  a{color:#b08d2f;text-decoration:none;border-bottom:1px solid rgba(176,141,47,.35);padding-bottom:2px}
</style>
</head>
<body>
<div>
  <span class="mark">L0B</span>
  <h1 id="msg">Nothing here.</h1>
  <p id="sub">This address does not open anything of ours.</p>
  <p><a href="https://door.effectra.ai">The door</a></p>
</div>
<script>
(function () {
  var m = location.pathname.match(/^\/l\/([A-Za-z0-9]{4,20})\/?$/);
  if (m) {
    document.getElementById('msg').textContent = 'Opening it…';
    location.replace('/l/?c=' + encodeURIComponent(m[1]));
  }
})();
</script>
</body>
</html>
